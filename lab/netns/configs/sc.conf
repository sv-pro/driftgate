! edge-sc: scrubbing edge. AS 65001. BGP to the customer edge runs over the GRE tunnel.
frr defaults traditional
hostname edge-sc
log stdout informational
!
router bgp 65001
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 172.16.0.2 remote-as 65002
 neighbor 172.16.0.2 description cust-gre
 neighbor 172.16.0.2 timers 3 9
 neighbor 172.16.0.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.0.1/32
 exit-address-family
!
line vty
!
