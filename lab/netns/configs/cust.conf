! edge-cust: customer edge. AS 65002. Announces the protected prefix to edge-sc over GRE.
frr defaults traditional
hostname edge-cust
log stdout informational
!
ip route 198.51.100.0/24 blackhole
!
router bgp 65002
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 172.16.0.1 remote-as 65001
 neighbor 172.16.0.1 description sc-gre
 neighbor 172.16.0.1 timers 3 9
 neighbor 172.16.0.1 timers connect 5
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
 exit-address-family
!
line vty
!
