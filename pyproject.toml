[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftgate"
version = "0.1.0"
description = "Agents may act on infrastructure only within their mandate, and only on verified reality."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
driftgate = "driftgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lab: needs root and a running netns lab (lab/netns/lab.sh up)"]
